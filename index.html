<script id="embedded-problems" type="application/json">{"schemaVersion":1,"problems":[{"id":"876be89b-3de8-4450-bec2-4eadd12cf922","title":"LCM Challenge","problemId":"236C","platform":"Codeforces","url":"https://codeforces.com/problemset/problem/236/C","difficulty":"Medium","category":"Number Theory","tags":["Greedy","Number Theory","LCM","Coprime Numbers","Case Analysis"],"shortDescription":"Find three positive integers not greater than n that maximize their least common multiple (LCM).","statement":"Some days ago, I learned the concept of LCM (least common multiple). I've played with it for several times and I want to make a big number with it.\n\nBut I also don't want to use many numbers, so I'll choose three positive integers (they don't have to be distinct) which are not greater than n. Can you help me to find the maximum possible least common multiple of these three integers?","input":"The first line contains an integer n — the upper bound for the three selected positive integers.","output":"Print a single integer — the maximum possible LCM of three not necessarily distinct positive integers that are not greater than n.","constraints":"1 ≤ n ≤ 10^6\nThe three selected integers must be positive and each must be ≤ n.","examples":[{"input":"9","output":"504","explanation":"Official sample.\nOne optimal choice is (9, 8, 7). These three numbers are pairwise coprime, so their LCM equals their product:\nLCM(9, 8, 7) = 9 × 8 × 7 = 504."},{"input":"7","output":"210","explanation":"Official sample.\nOne optimal choice is (7, 6, 5). These numbers are pairwise coprime, so:\nLCM(7, 6, 5) = 7 × 6 × 5 = 210."},{"input":"1","output":"1","explanation":"Additional test case (generated).\nMinimum possible value of n. The only available positive integer is 1, so the three selected numbers must all be 1."},{"input":"2","output":"2","explanation":"Additional test case (generated).\nSmall boundary case. Choosing (2, 2, 2) gives an LCM of 2."},{"input":"3","output":"6","explanation":"Additional test case (generated).\nSmallest odd case handled by the first branch. Choose (3, 2, 1):\nLCM(3, 2, 1) = 3 × 2 × 1 = 6."},{"input":"4","output":"12","explanation":"Additional test case (generated).\nEven n not divisible by 3. The algorithm chooses (4, 3, 1), giving:\nLCM(4, 3, 1) = 12."},{"input":"6","output":"60","explanation":"Additional test case (generated).\nEven n divisible by 3. The algorithm chooses (5, 4, 3), giving:\nLCM(5, 4, 3) = 5 × 4 × 3 = 60."},{"input":"8","output":"280","explanation":"Additional test case (generated).\nEven n not divisible by 3. Choose (8, 7, 5):\nLCM(8, 7, 5) = 8 × 7 × 5 = 280."},{"input":"10","output":"630","explanation":"Additional test case (generated).\nEven n not divisible by 3. Choose (10, 9, 7):\nLCM(10, 9, 7) = 10 × 9 × 7 = 630."},{"input":"12","output":"990","explanation":"Additional test case (generated).\nEven n divisible by 3. Choose (11, 10, 9):\nLCM(11, 10, 9) = 11 × 10 × 9 = 990."},{"input":"1000000","output":"999996000003000000","explanation":"Additional test case (generated).\nMaximum constraint. Since n is even and not divisible by 3, the algorithm chooses (1000000, 999999, 999997).\nTheir LCM is their product:\n1000000 × 999999 × 999997 = 999996000003000000.\nThis also demonstrates why a 64-bit integer is necessary."}],"approach":"Use mathematical observations about parity and divisibility by 3 to select three integers with a maximum LCM.\n\nThe main idea is to select numbers close to n while avoiding common factors between them. When the selected numbers are pairwise coprime, their LCM is simply their product.\n\nThe algorithm handles four situations:\n\n1. Small values (n ≤ 2): Return n directly, since selecting n three times produces an LCM of n.\n\n2. Odd n: Select (n, n-1, n-2). These three numbers are pairwise coprime, so the answer is their product.\n\n3. Even n not divisible by 3: Select (n, n-1, n-3). We skip n-2 because it shares a factor of 2 with n. The selected numbers are pairwise coprime, so their LCM equals their product.\n\n4. Even n divisible by 3: Select (n-1, n-2, n-3). We avoid n because it shares a factor of 2 with n-2 and a factor of 3 with n-3. The three selected numbers are pairwise coprime.\n\nThe implementation uses three simple conditional checks and calculates the corresponding product directly.","reasoning":"The key observation is that the LCM of several positive integers is always less than or equal to their product:\n\nLCM(a, b, c) ≤ a × b × c.\n\nEquality holds when the three numbers are pairwise coprime, meaning that every pair has a GCD of 1.\n\nTherefore, we want numbers as close to n as possible while avoiding shared factors. This leads to three different cases.\n\nCASE 1: n is odd.\n\nChoose:\n(a, b, c) = (n, n-1, n-2).\n\nWhy does this work?\n\n- Consecutive integers are always coprime, so gcd(n, n-1) = 1 and gcd(n-1, n-2) = 1.\n- Both n and n-2 are odd. Their difference is 2, so their GCD must divide 2. Since both are odd, gcd(n, n-2) = 1.\n\nAll three numbers are pairwise coprime. Therefore:\n\nAnswer = n × (n-1) × (n-2).\n\nExample: n = 9\n\nChoose (9, 8, 7).\n\nLCM(9, 8, 7) = 9 × 8 × 7 = 504.\n\nCASE 2: n is even but not divisible by 3.\n\nIf we choose the three closest numbers (n, n-1, n-2), we encounter a problem:\n\ngcd(n, n-2) = 2.\n\nThis means their LCM is smaller than their product.\n\nInstead, skip n-2 and select:\n(a, b, c) = (n, n-1, n-3).\n\nNow examine their GCDs:\n\n- gcd(n, n-1) = 1 because they are consecutive.\n- gcd(n, n-3) = gcd(n, 3) = 1 because n is not divisible by 3.\n- gcd(n-1, n-3) = 1 because both numbers are odd and differ by 2.\n\nTherefore, the three numbers are pairwise coprime.\n\nAnswer = n × (n-1) × (n-3).\n\nExample: n = 10\n\nChoose (10, 9, 7).\n\nLCM(10, 9, 7) = 10 × 9 × 7 = 630.\n\nCASE 3: n is even and divisible by 3.\n\nIn this case, choosing n together with nearby numbers introduces shared factors:\n\n- n and n-2 share a factor of 2.\n- n and n-3 share a factor of 3.\n\nInstead, skip n and select:\n(a, b, c) = (n-1, n-2, n-3).\n\nCheck their GCDs:\n\n- gcd(n-1, n-2) = 1 because they are consecutive.\n- gcd(n-2, n-3) = 1 because they are consecutive.\n- gcd(n-1, n-3) = 1 because both are odd and differ by 2.\n\nTherefore, all three numbers are pairwise coprime.\n\nAnswer = (n-1) × (n-2) × (n-3).\n\nExample: n = 12\n\nChoose (11, 10, 9).\n\nLCM(11, 10, 9) = 11 × 10 × 9 = 990.\n\nSMALL VALUES:\n\nWhen n ≤ 2, returning n is sufficient because we can choose the same number three times, and no LCM can exceed n for these particular bounds.\n\nFINAL OBSERVATION:\n\nThe solution does not need to calculate GCD or LCM explicitly. Instead, it uses mathematical properties to identify three pairwise coprime integers whose product gives the maximum possible LCM.\n\nThis allows the entire problem to be solved using simple arithmetic and conditional statements.","solution":"#include \u003ciostream>\nusing namespace std;\n\nusing ll = long long;\n\nll maximumLCM(ll n) {\n    \n    if (n \u003c= 2) {\n        return n;\n    }\n\n    // Case 1: n is odd.\n    if (n % 2 != 0) {\n        return n * (n - 1) * (n - 2);\n    }\n\n    // if the above condition didn't work this means that n is even\n\n    // Case 2: n is even but not divisible by 3. (something like 10 as the numbers will be 10, 9, 8)\n    if (n % 3 != 0) {\n        return n * (n - 1) * (n - 3);\n    }\n\n    // Case 3: n even and divisible by 3. (something like : 12 as the numbers will be 12, 11, 10, 9, 8)\n    return (n - 1) * (n - 2) * (n - 3);\n}\n\nint main() {\n    ll n;\n    cin >> n;\n\n    cout \u003c\u003c maximumLCM(n) \u003c\u003c '\\n';\n\n    return 0;\n}","timeComplexity":"O(1) — The algorithm performs a fixed number of conditional checks and arithmetic operations, regardless of the value of n.","spaceComplexity":"O(1) — Only a constant number of variables are used. No additional data structures are required.","notes":"1. A 64-bit integer (long long) is essential because the answer can approach 10^18, which exceeds the range of a 32-bit signed integer.\n\n2. The maximum constraint is n = 10^6. The resulting answer is 999996000003000000, which safely fits within a signed 64-bit integer.\n\n3. Useful mathematical identity: gcd(a, b) = gcd(a, b-a). This helps explain why the GCD of two numbers differing by 2 can only be 1 or 2, and why odd numbers with a difference of 2 must be coprime.\n\n4. Important code-comment clarification: In Case 2, the expression selects (n, n-1, n-3). For n = 10, this means (10, 9, 7), not (10, 9, 8). In Case 3, for n = 12, the expression selects (11, 10, 9), not all of (12, 11, 10, 9, 8). The implementation itself is correct; only those illustrative comments should be corrected if desired.\n\n5. The main lesson is that maximizing an LCM is not always the same as choosing the three largest integers. Shared prime factors can reduce the LCM, so choosing slightly smaller pairwise coprime integers can produce a larger result.","relatedProblems":[],"createdAt":"2026-11-09T18:44:12.348Z","updatedAt":"2026-11-09T18:44:12.348Z"},{"id":"3bdfb9e5-8a14-4d25-a720-ec436138fbc7","title":"Easy Number Challenge","problemId":"236B","platform":"Codeforces","url":"https://codeforces.com/problemset/problem/236/B","difficulty":"Easy","category":"Number Theory","tags":["Implementation","Number Theory","Sieve","Divisor Counting","Precomputation","Brute Force"],"shortDescription":"Calculate the sum of the number of divisors of every possible product formed by choosing one integer from each of three given ranges.","statement":"Let's denote d(n) as the number of divisors of a positive integer n. You are given three integers a, b and c. Your task is to calculate the following sum:\n\nS = sum(i = 1 to a) sum(j = 1 to b) sum(k = 1 to c) d(i * j * k)\n\nFind the sum modulo 1073741824 (2^30).\n\nHere, d(x) represents the number of positive divisors of x.","input":"The first line contains three space-separated integers a, b and c.","output":"Print a single integer — the required sum modulo 1073741824 (2^30).","constraints":"1 ≤ a, b, c ≤ 100\n\nMaximum possible product: a * b * c ≤ 1,000,000\n\nMOD = 1073741824 = 2^30","examples":[{"input":"2 2 2","output":"20","explanation":"Official sample.\n\nWe have 8 possible combinations:\n\n(1,1,1) → d(1) = 1\n(1,1,2) → d(2) = 2\n(1,2,1) → d(2) = 2\n(1,2,2) → d(4) = 3\n(2,1,1) → d(2) = 2\n(2,1,2) → d(4) = 3\n(2,2,1) → d(4) = 3\n(2,2,2) → d(8) = 4\n\nTotal = 1 + 2 + 2 + 3 + 2 + 3 + 3 + 4 = 20."},{"input":"5 6 7","output":"1520","explanation":"Official sample.\n\nThere are 5 * 6 * 7 = 210 combinations. We calculate the divisor count of every resulting product and sum all 210 values modulo 2^30."},{"input":"1 1 1","output":"1","explanation":"Additional test case (generated).\n\nMinimum possible input. There is only one combination: (1,1,1).\n\nThe number 1 has exactly one positive divisor, so the answer is 1."},{"input":"1 1 10","output":"27","explanation":"Additional test case (generated).\n\nSince a = b = 1, the sum becomes d(1) + d(2) + ... + d(10).\n\nThe divisor counts are 1, 2, 2, 3, 2, 4, 2, 4, 3, 4.\n\nTheir sum is 27."},{"input":"1 2 3","output":"14","explanation":"Additional test case (generated).\n\nThe combinations produce the products:\n1, 2, 3, 2, 4, 6.\n\nTheir divisor counts are:\n1, 2, 2, 2, 3, 4.\n\nTotal = 14.\n\nThis case also demonstrates that the same product can appear through different combinations."},{"input":"1 10 10","output":"596","explanation":"Additional test case (generated).\n\nOne dimension is fixed at 1, while the other two range from 1 to 10.\n\nThere are 100 combinations. The divisor counts of all resulting products sum to 596."},{"input":"100 100 100","output":"51103588","explanation":"Additional test case (generated).\n\nMaximum constraints.\n\nThere are 100 * 100 * 100 = 1,000,000 combinations, and the largest possible product is 1,000,000.\n\nThis tests the maximum preprocessing array size and the full triple-loop enumeration."}],"approach":"Use a divisor-counting sieve to precompute the number of divisors for every integer from 1 to a*b*c. Then enumerate all possible triples using three nested loops and retrieve the corresponding divisor count in O(1) time.\n\nPART 1: PRECOMPUTE DIVISOR COUNTS.\n\nLet limit = a * b * c, which is at most 1,000,000.\n\nCreate an integer array divisors of size limit + 1, initialized with zeros.\n\nFor every possible divisor d from 1 to limit, iterate through all its multiples:\n\n- Start at multiple = d.\n- Increase multiple by d in every iteration.\n- Increment divisors[multiple].\n\nAfter processing all possible divisors, divisors[x] contains the exact number of positive divisors of x.\n\nPART 2: ENUMERATE ALL COMBINATIONS.\n\nUse three nested loops:\n\n- i ranges from 1 to a.\n- j ranges from 1 to b.\n- k ranges from 1 to c.\n\nFor every combination, calculate product = i * j * k.\n\nRetrieve its divisor count directly using divisors[product] and add it to the running sum.\n\nPART 3: APPLY MODULO.\n\nAfter each addition, apply modulo 2^30 (1073741824) to keep the answer within the required range.\n\nFinally, print the accumulated sum.\n\nThe important optimization is that divisor counts are calculated once during preprocessing instead of being recalculated for every combination.","reasoning":"The first question is: how can we calculate d(i*j*k) efficiently for up to one million different combinations?\n\nA direct approach would calculate the number of divisors separately for every product. However, this is wasteful because many combinations can produce the same product.\n\nFor example:\n\n1 * 2 * 2 = 4\n2 * 1 * 2 = 4\n2 * 2 * 1 = 4\n\nAll three combinations produce the same number. There is no reason to calculate the divisors of 4 three separate times.\n\nWe can solve this by precomputing divisor counts for all possible products.\n\nFIRST: WHY DOES THE DIVISOR SIEVE WORK?\n\nRecall that d(x) means the number of positive integers that divide x without leaving a remainder.\n\nFor example:\n\nd(6) = 4 because its positive divisors are 1, 2, 3 and 6.\n\nd(8) = 4 because its positive divisors are 1, 2, 4 and 8.\n\nd(12) = 6 because its positive divisors are 1, 2, 3, 4, 6 and 12.\n\nNow think about the following question:\n\nInstead of checking every possible divisor for every number, what if we take a divisor and directly visit all the numbers it divides?\n\nFor example, consider d = 2.\n\nIts multiples are:\n2, 4, 6, 8, 10, 12, ...\n\nEvery one of these numbers is divisible by 2. Therefore, 2 should contribute one to the divisor count of each of them.\n\nThe same idea applies to every possible divisor.\n\nWhen d = 1, we visit every number because 1 divides every positive integer.\n\nWhen d = 2, we visit 2, 4, 6, 8, and so on.\n\nWhen d = 3, we visit 3, 6, 9, 12, and so on.\n\nWe continue until d reaches limit.\n\nFor example, let's manually build the divisor counts up to 6.\n\nInitially:\n\ndivisors = [0, 0, 0, 0, 0, 0, 0]\n\nAfter processing d = 1:\n\ndivisors[1]++, divisors[2]++, divisors[3]++ ...\n\nResult for numbers 1 to 6:\n1, 1, 1, 1, 1, 1\n\nEvery number has at least one divisor: itself.\n\nAfter processing d = 2:\n\nWe visit 2, 4, 6.\n\nResult:\n1, 2, 1, 2, 1, 2\n\nAfter processing d = 3:\n\nWe visit 3 and 6.\n\nResult:\n1, 2, 2, 2, 1, 3\n\nAfter processing d = 4:\n\nWe visit 4.\n\nResult:\n1, 2, 2, 3, 1, 3\n\nAfter processing d = 5:\n\nWe visit 5.\n\nResult:\n1, 2, 2, 3, 2, 3\n\nAfter processing d = 6:\n\nWe visit 6.\n\nFinal result:\n\n1, 2, 2, 3, 2, 4\n\nNotice that these are exactly the number of positive divisors of every integer from 1 to 6.\n\nWHY IS THIS CORRECT?\n\nEvery positive divisor d of a number x will eventually be processed by the outer loop.\n\nWhen the outer loop reaches that d, the inner loop visits x because x is one of its multiples.\n\nTherefore, divisors[x] is incremented exactly once for every positive divisor of x.\n\nConsequently, after completing the sieve, divisors[x] = d(x).\n\nSECOND: WHY DO WE NEED THREE NESTED LOOPS?\n\nThe mathematical expression requires summing over every valid combination of i, j and k.\n\nThe three nested loops represent these exact ranges:\n\n1 ≤ i ≤ a\n1 ≤ j ≤ b\n1 ≤ k ≤ c\n\nEach combination must contribute its divisor count, even when another combination produces the same product.\n\nWe calculate:\n\nproduct = i * j * k\n\nThen retrieve:\n\ndivisors[product]\n\nBecause the preprocessing is complete, this array access gives us the required divisor count immediately.\n\nTHIRD: WHY DO WE USE MODULO?\n\nThe problem asks for the final answer modulo 1073741824, which equals 2^30.\n\nTherefore, instead of allowing the running sum to grow indefinitely, we update it after every addition:\n\nsum = (sum + divisors[product]) % MOD\n\nThis ensures that the accumulated result always remains within the required modular range.\n\nFinally, all three phases work together:\n\n1. Precompute every divisor count.\n2. Enumerate every combination.\n3. Add the corresponding precomputed divisor count to the answer.","solution":"#include \u003ciostream>\n#include \u003cvector>\nusing namespace std;\n\nconst long long MOD = (1LL \u003c\u003c 30);\n\nint main() {\n    int a, b, c;\n    cin >> a >> b >> c;\n\n    // Maximum possible product\n    int limit = a * b * c;\n\n    vector\u003cint> divisors(limit + 1, 0);\n\n    // Sieve (the variable called 'd' instead of 'i' as in represents the current divisor)\n    // and the inner variable called 'multiple' as in represents the multiplyers of the number\n    // for example if the 'd' is 2 so the multiples will be 2 then 4 then 6 and so on\n    for (int d = 1; d \u003c= limit; d++) {\n\n        for (int multiple = d; multiple \u003c= limit; multiple += d) {\n            divisors[multiple]++;\n        }\n    }\n\n    long long sum = 0;\n\n    for (int i = 1; i \u003c= a; i++) {\n        for (int j = 1; j \u003c= b; j++) {\n            for (int k = 1; k \u003c= c; k++) {\n\n                int product = i * j * k;\n\n                sum = (sum + divisors[product]) % MOD;\n            }\n        }\n    }\n\n    cout \u003c\u003c sum \u003c\u003c '\\n';\n\n    return 0;\n}","timeComplexity":"O(abc * log(abc)) — Let N = a*b*c. The divisor sieve performs sum(N/d) over all d from 1 to N, which is O(N log N). The three nested loops process exactly abc combinations, each with an O(1) array lookup. Therefore, the total complexity is O(N log N + abc) = O(abc log(abc)).","spaceComplexity":"O(abc) — The divisors vector stores one integer for every possible product from 0 to a*b*c. No additional data structures proportional to the input size are required.","notes":"1. This technique is commonly called a divisor sieve or sieve-based divisor counting. It is conceptually similar to the Sieve of Eratosthenes, but instead of marking composite numbers, it counts how many divisors each number has.\n\n2. The maximum possible product is 100 * 100 * 100 = 1,000,000, so the divisors array has at most 1,000,001 elements. This comfortably fits in memory.\n\n3. The variable d in the preprocessing loop represents the current divisor, not the number of divisors. The variable multiple represents the numbers divisible by that divisor.\n\n4. The same product can appear through multiple different combinations. We must still add its divisor count once for every combination because the original summation counts every triple separately.\n\n5. The modulo is 2^30 = 1073741824. The expression (1LL \u003c\u003c 30) correctly calculates this value using a 64-bit integer literal.\n\n6. The product is stored in an int, which is safe because its maximum value is 1,000,000. The divisor counts also comfortably fit in int. The running sum uses long long for safe arithmetic.\n\n7. The divisor count of 1 is 1, not 0. The sieve handles this automatically because the first iteration, d = 1, increments divisors[1].\n\n8. Precomputation is especially useful when multiple combinations produce the same product. Instead of repeatedly calculating divisors, we calculate each possible number's divisor count once and reuse it.\n\n9. The additional test cases include minimum bounds, a single varying dimension, repeated products, asymmetric dimensions, and the maximum constraints.","relatedProblems":[],"createdAt":"2026-11-09T18:52:36.103Z","updatedAt":"2026-11-09T18:52:36.103Z"},{"id":"ec3a9ef9-9bfc-489c-8f1d-9b651ad22ea6","title":"Maximum GCD","problemId":"1370A","platform":"Codeforces","url":"https://codeforces.com/problemset/problem/1370/A","difficulty":"Easy","category":"Number Theory","tags":["GCD","Mathematics","Greedy","Math Observation"],"shortDescription":"Find the maximum possible GCD among all pairs of distinct positive integers between 1 and n.","statement":"Let's consider all integers in the range from 1 to n (inclusive).\n\nAmong all pairs of distinct integers in this range, find the maximum possible greatest common divisor of integers in the pair.\n\nFormally, find the maximum value of gcd(a,b), where 1 ≤ a \u003c b ≤ n.\n\nThe greatest common divisor gcd(a,b) of two positive integers a and b is the biggest integer that divides both of them.","input":"The first line contains a single integer t — the number of test cases.\n\nEach test case contains a single integer n.","output":"For each test case, output the maximum value of gcd(a,b) among all pairs satisfying 1 ≤ a \u003c b ≤ n.","constraints":"1 ≤ t ≤ 100\n2 ≤ n ≤ 10^6","examples":[{"input":"2\n3\n5","output":"1\n2","explanation":"Official sample.\n\nFor n = 3, the possible pairs are (1,2), (1,3), and (2,3). Every pair has GCD equal to 1.\n\nFor n = 5, we can choose (2,4), and gcd(2,4) = 2.\n\nTherefore, the answers are 1 and 2."},{"input":"5\n2\n4\n6\n7\n10","output":"1\n2\n3\n3\n5","explanation":"Additional test cases (generated).\n\nFor n = 2, the best pair is (1,2), giving GCD 1.\n\nFor n = 4, choose (2,4), giving GCD 2.\n\nFor n = 6, choose (3,6), giving GCD 3.\n\nFor n = 7, choose (3,6), giving GCD 3.\n\nFor n = 10, choose (5,10), giving GCD 5.\n\nThese cases demonstrate the formula for both even and odd values of n."}],"approach":"Use a direct mathematical observation instead of calculating GCDs for every possible pair.\n\nThe maximum possible GCD is always floor(n / 2).\n\nTherefore, for every test case, simply divide n by 2 using integer division and print the result.\n\nNo loops over pairs and no explicit GCD calculations are needed.","reasoning":"We want to maximize gcd(a,b), where 1 ≤ a \u003c b ≤ n.\n\nFIRST: ESTABLISH AN UPPER BOUND.\n\nSuppose the GCD of two distinct numbers a and b is g.\n\nThis means that both a and b are multiples of g.\n\nThe smallest positive multiple of g is g itself, and the next distinct positive multiple is 2g.\n\nBecause a and b are distinct, they must be at least these two multiples. Therefore, the larger number cannot be smaller than 2g.\n\nSince both numbers must be at most n:\n\n2g ≤ n\n\ng ≤ n / 2\n\nSince g is an integer, this gives:\n\ng ≤ floor(n / 2)\n\nThis proves that we cannot obtain a GCD greater than floor(n / 2).\n\nSECOND: SHOW THAT THIS BOUND IS ACHIEVABLE.\n\nChoose:\n\na = floor(n / 2)\n\nb = 2 * floor(n / 2)\n\nBoth numbers are positive and satisfy a \u003c b ≤ n.\n\nSince b is exactly twice a:\n\ngcd(a, 2a) = a\n\nTherefore:\n\ngcd(a,b) = floor(n / 2)\n\nWe have found a pair that achieves the upper bound.\n\nFINAL CONCLUSION:\n\nThe maximum possible GCD is exactly:\n\nfloor(n / 2)\n\nC++ integer division automatically performs the floor operation for positive integers, so the complete solution is simply n / 2.","solution":"#include \u003ciostream> \n#include \u003cvector>\nusing namespace std;\n\nint main() {\n\n    int test, n;\n    cin >> test;\n\n    while (test--) {\n        cin >> n;\n        cout \u003c\u003c n / 2 \u003c\u003c \"\\n\";\n    }\n}","timeComplexity":"O(1) per test case, or O(t) for all test cases. Each test case performs one integer division.","spaceComplexity":"O(1) auxiliary space. Only a constant number of variables are used.","notes":"1. The important observation is that maximizing the GCD does not require checking all possible pairs. We can derive the answer mathematically.\n\n2. For every positive integer g to be a common divisor of two distinct positive numbers, there must be at least two distinct multiples of g within the range: g and 2g. This directly gives the upper bound.\n\n3. The pair (floor(n/2), 2*floor(n/2)) proves that the upper bound is achievable.\n\n4. Integer division in C++ automatically gives floor(n/2) because n is positive.\n\n5. The vector header in the submitted solution is unused, but it does not affect correctness.","relatedProblems":[],"createdAt":"2026-11-09T19:29:01.309Z","updatedAt":"2026-11-09T19:29:01.309Z"},{"id":"98032a75-87e5-4f91-ae8a-3284fd084aa6","title":"Modular Exponentiation","problemId":"913A","platform":"Codeforces","url":"https://codeforces.com/problemset/problem/913/A","difficulty":"Easy","category":"Mathematics","tags":["Powers of Two","Modulo","Bit Manipulation","Mathematical Observation","Overflow"],"shortDescription":"Calculate the remainder of m divided by 2 raised to the power n, without unnecessarily calculating an extremely large power.","statement":"The following problem is well-known: given integers n and m, calculate the remainder of 2^n divided by m.\n\nYou are asked to solve the reverse problem. Given integers n and m, calculate:\n\nm mod 2^n\n\nHere, 2^n represents the product of n factors equal to 2, and the modulo operation represents the remainder of division.","input":"The first line contains a single integer n.\n\nThe second line contains a single integer m.","output":"Output a single integer — the value of m modulo 2^n.","constraints":"1 ≤ n ≤ 10^8\n1 ≤ m ≤ 10^8","examples":[{"input":"4\n42","output":"10","explanation":"Official sample.\n\n2^4 = 16.\n\n42 modulo 16 = 10.\n\nTherefore, the answer is 10."},{"input":"1\n58","output":"0","explanation":"Official sample.\n\n2^1 = 2.\n\n58 is divisible by 2 without a remainder.\n\nTherefore, 58 modulo 2 = 0."},{"input":"98765432\n23456789","output":"23456789","explanation":"Official sample.\n\n2 raised to such a large power is much greater than m = 23456789.\n\nWhen the divisor is greater than the dividend, the remainder is the dividend itself.\n\nTherefore, the answer is 23456789."},{"input":"2\n10","output":"2","explanation":"Additional test case (generated).\n\n2^2 = 4.\n\n10 modulo 4 = 2."},{"input":"26\n100000000","output":"32891136","explanation":"Additional test case (generated).\n\n2^26 = 67108864.\n\n100000000 modulo 67108864 = 32891136."},{"input":"27\n100000000","output":"100000000","explanation":"Additional test case (generated).\n\n2^27 = 134217728, which is greater than m.\n\nTherefore, the remainder is m itself: 100000000."},{"input":"31\n100000000","output":"100000000","explanation":"Additional test case (generated; overflow boundary).\n\n2^31 is greater than the maximum signed 32-bit integer value, and it is also greater than m.\n\nTherefore, the correct answer is m itself: 100000000.\n\nIMPORTANT: The submitted solution is not safe for this test because converting pow(2,31) to int causes an out-of-range conversion."}],"approach":"The mathematical expression is m modulo 2^n.\n\nThe key observation is that we do not need to calculate 2^n if it is already greater than m.\n\nIf 2^n > m, then:\n\nm mod 2^n = m\n\nOtherwise, calculate the power of two and perform the modulo operation.\n\nSince m ≤ 10^8, the power of two becomes larger than m very quickly. Therefore, a safe implementation can stop calculating as soon as the power exceeds m.","reasoning":"The important question is: do we actually need to calculate a very large value of 2^n?\n\nRecall the basic modulo property:\n\nIf a number x is smaller than a positive divisor y, then:\n\nx mod y = x\n\nOur task is to calculate:\n\nm mod 2^n\n\nThere are two possible cases.\n\nCASE 1: 2^n ≤ m.\n\nThe divisor does not exceed the dividend, so we need to calculate the actual remainder.\n\nFor example:\n\nn = 4, m = 42\n\n2^4 = 16\n\n42 mod 16 = 10\n\nCASE 2: 2^n > m.\n\nNow the divisor is greater than the dividend.\n\nTherefore:\n\nm mod 2^n = m\n\nFor example:\n\nn = 5, m = 20\n\n2^5 = 32\n\nSince 20 \u003c 32, the answer is simply 20.\n\nIMPORTANT OBSERVATION:\n\nThe maximum value of m is only 100,000,000.\n\nWe know that:\n\n2^26 = 67,108,864\n\n2^27 = 134,217,728\n\nTherefore, for every n ≥ 27, the divisor 2^n is guaranteed to be greater than m.\n\nIn this situation, the answer is immediately m.\n\nThis means we never need to calculate an enormous power of two.\n\nFor smaller n, we can safely calculate 2^n and perform the modulo operation.","solution":"#include \u003ciostream>\n#include \u003ccmath>\nusing namespace std;\n\nint main() {\n    int n, m;\n    cin >> n >> m;\n\n    int product = pow(2, n);\n\n    cout \u003c\u003c m % product \u003c\u003c \"\\n\";\n\n    return 0;\n}","timeComplexity":"For the submitted implementation, the pow operation is treated as O(1), but it is not safe for the full constraints because of overflow. A corrected bounded-power implementation takes O(log m) time, which is at most 27 iterations for the given constraints.","spaceComplexity":"O(1) auxiliary space.","notes":"1. CRITICAL CORRECTNESS ISSUE: The submitted implementation calculates pow(2,n), which returns a floating-point value, and converts it into an int. For n ≥ 31, the mathematical result exceeds the maximum signed 32-bit integer value. Converting an out-of-range floating-point value to int has undefined behavior in C++. The solution is therefore not safe for the full problem constraints.\n\n2. The maximum m is 100,000,000. Since 2^27 = 134,217,728 is already greater than this maximum, every input with n ≥ 27 has answer m directly.\n\n3. A recommended safe replacement for the calculation is:\n\nlong long power = 1;\nfor (int i = 0; i \u003c n && power \u003c= m; i++) {\n    power *= 2;\n}\ncout \u003c\u003c (power > m ? m : m % power) \u003c\u003c '\\\\n';\n\nThis loop stops as soon as the power exceeds m, so it never creates an unnecessarily large value. Its runtime is O(log m).\n\n4. Avoid using pow() for integer arithmetic when an exact integer result is required and the result might exceed the target integer type.\n\n5. The additional test with n = 31 is intentionally included to demonstrate the overflow problem in the submitted implementation. The expected output is mathematically correct, but the submitted code is not guaranteed to produce it.","relatedProblems":[],"createdAt":"2026-11-09T19:29:22.628Z","updatedAt":"2026-11-09T19:29:22.628Z"},{"id":"a99c1ef2-9adb-4b9b-ac3d-97e0bc35e255","title":"Comparing Strings","problemId":"186A","platform":"Codeforces","url":"https://codeforces.com/problemset/problem/186/A","difficulty":"Easy","category":"Strings","tags":["Strings","Implementation","Character Comparison","Swapping","Greedy"],"shortDescription":"Determine whether two different strings can become identical by swapping exactly two characters in the first string.","statement":"Some dwarves that are finishing the StUDY (State University for Dwarven Youngsters) Bachelor courses, have been told \"no genome, no degree\". That means that all dwarves should write a thesis on genome.\n\nDwarven genome is represented by a string consisting of lowercase Latin letters.\n\nDwarf Misha has already chosen the subject for his thesis: determining by two dwarven genomes whether they belong to the same race.\n\nTwo dwarves belong to the same race if we can swap two characters in the first dwarf's genome and get the second dwarf's genome as a result.\n\nHelp Dwarf Misha and find out whether the two genomes belong to the same race or not.","input":"The first line contains the first dwarf's genome: a non-empty string consisting of lowercase Latin letters.\n\nThe second line contains the second dwarf's genome: a non-empty string consisting of lowercase Latin letters.","output":"Print YES if the second string can be obtained by swapping exactly two characters in the first string. Otherwise, print NO.","constraints":"1 ≤ |s|, |t| ≤ 10^5\nBoth strings consist only of lowercase Latin letters.\nThe two strings are guaranteed to be different.\nThe strings may have different lengths.","examples":[{"input":"ab\nba","output":"YES","explanation":"Official sample.\n\nThe strings differ at both positions:\n\ns = ab\nt = ba\n\nSwapping the two characters of s produces ba, which is exactly t.\n\nTherefore, the answer is YES."},{"input":"aa\nab","output":"NO","explanation":"Official sample.\n\nThe first string contains two occurrences of a and no occurrence of b.\n\nSwapping two characters cannot introduce a new character that was not originally present.\n\nTherefore, the answer is NO."},{"input":"4\nabc\nacb\naab\naba\nabc\nabd\nab\nabc","output":"YES\nYES\nNO\nNO","explanation":"Additional test cases (generated).\n\n1. abc → acb: YES. The characters b and c are swapped.\n\n2. aab → aba: YES. The last two characters are swapped.\n\n3. abc → abd: NO. Only one position differs, so no single swap can produce the target.\n\n4. ab → abc: NO. The strings have different lengths."}],"approach":"Compare the two strings position by position and record where their characters differ.\n\nFirst, check whether both strings have the same length. If their lengths differ, the answer is immediately NO because swapping characters cannot change a string's length.\n\nNext, traverse both strings and count the mismatched positions.\n\nStore the first and second mismatch indices.\n\nIf a third mismatch is found, immediately print NO because swapping two characters can affect only two positions.\n\nAfter the traversal, there must be exactly two mismatches. Finally, verify that the characters at those positions are swapped:\n\ns[first] == t[second]\ns[second] == t[first]\n\nIf both conditions are true, print YES. Otherwise, print NO.","reasoning":"A swap operation selects exactly two positions and exchanges their characters.\n\nThis gives us an important observation: a single swap can change the characters at at most two positions.\n\nTherefore, we can solve the problem by examining the positions where the strings differ.\n\nCASE 1: THE LENGTHS ARE DIFFERENT.\n\nA swap cannot add or remove characters.\n\nTherefore, if the strings have different lengths, transforming one into the other is impossible.\n\nCASE 2: MORE THAN TWO POSITIONS ARE DIFFERENT.\n\nOne swap affects only two positions.\n\nIf three or more positions contain different characters, no single swap can fix all of them.\n\nTherefore, the answer is NO.\n\nCASE 3: EXACTLY TWO POSITIONS ARE DIFFERENT.\n\nSuppose the mismatched positions are first and second.\n\nFor a single swap to solve the problem, the character at the first position in s must equal the character at the second position in t, and vice versa.\n\nIn other words:\n\ns[first] == t[second]\n\ns[second] == t[first]\n\nIf both conditions hold, swapping those two positions produces t exactly.\n\nCASE 4: ZERO MISMATCHED POSITIONS.\n\nThe strings are already identical, so zero swaps would be required. However, the problem guarantees that the two strings are different, meaning this case does not occur in valid input.\n\nEXAMPLE:\n\ns = abca\nt = acba\n\nCompare every position:\n\nIndex 0: a == a\nIndex 1: b != c\nIndex 2: c != b\nIndex 3: a == a\n\nThere are exactly two mismatches.\n\nAt the first mismatch, s contains b while t contains c.\nAt the second mismatch, s contains c while t contains b.\n\nThe characters are swapped, so the answer is YES.\n\nThis approach avoids actually modifying the string because we only need to verify whether one swap would be sufficient.","solution":"#include \u003ciostream>\nusing namespace std;\n\nint main() {\n    string s, t;\n    cin >> s >> t;\n\n    // The strings must have the same length\n    if (s.size() != t.size()) {\n        cout \u003c\u003c \"NO\\n\";\n        return 0;\n    }\n\n    int first = -1;\n    int second = -1;\n    int cnt = 0;\n\n    // Find the positions where the strings are different\n    for (int i = 0; i \u003c s.size(); i++) {\n        if (s[i] != t[i]) {\n            cnt++;\n\n            if (cnt == 1)\n                first = i;\n            else if (cnt == 2)\n                second = i;\n            else {\n                cout \u003c\u003c \"NO\\n\";\n                return 0;\n            }\n        }\n    }\n\n    // Check whether the two characters are swapped\n    if (cnt == 2 &&\n        s[first] == t[second] &&\n        s[second] == t[first]) {\n        cout \u003c\u003c \"YES\\n\";\n    }\n    else {\n        cout \u003c\u003c \"NO\\n\";\n    }\n\n    return 0;\n}","timeComplexity":"O(n), where n is the length of the strings. The solution performs one traversal to find the mismatched positions. It may terminate early after finding a third mismatch.","spaceComplexity":"O(1) auxiliary space. Only three integer variables are needed to track the mismatch count and positions.","notes":"1. A single swap changes exactly two positions when the swapped characters are different. Therefore, exactly two mismatches are necessary because the problem guarantees that the original strings are different.\n\n2. The two mismatched characters must be crossed: s[first] must equal t[second], and s[second] must equal t[first]. Merely having two mismatches is not enough.\n\n3. If there is only one mismatch, swapping cannot fix it because a swap changes two positions together.\n\n4. If there are more than two mismatches, the algorithm can terminate immediately without checking the remaining characters.\n\n5. The submitted implementation uses std::string but does not explicitly include \u003cstring>. It is advisable to include \u003cstring> for portable, standards-compliant code.","relatedProblems":[],"createdAt":"2026-11-09T19:29:35.499Z","updatedAt":"2026-11-09T19:29:35.499Z"},{"id":"1318b993-2861-4403-8e31-2ad3f3051623","title":"Slavic's Exam","problemId":"1999D","platform":"Codeforces","url":"https://codeforces.com/problemset/problem/1999/D","difficulty":"Easy","category":"Strings","tags":["Greedy","Strings","Subsequence","Two Pointers","Implementation"],"shortDescription":"Replace every question mark in a string so that another given string becomes its subsequence, or determine that it is impossible.","statement":"Slavic has a very tough exam and needs your help in order to pass it.\n\nThere exists a string s, which consists of lowercase English letters and possibly zero or more question marks (?).\n\nSlavic is asked to change each question mark to a lowercase English letter such that string t becomes a subsequence of s. A subsequence is not necessarily continuous, but its characters must appear in the same relative order.\n\nOutput any such resulting string, or report that it is impossible if no valid replacement exists.","input":"The first line contains a single integer T — the number of test cases.\n\nFor each test case:\n\nThe first line contains a string s consisting of lowercase English letters and question marks.\n\nThe second line contains a string t consisting only of lowercase English letters.","output":"For each test case, print NO if it is impossible to make t a subsequence of s.\n\nOtherwise, print YES followed by one valid resulting string s in which all question marks have been replaced.","constraints":"1 ≤ T ≤ 10^4\n1 ≤ |s| ≤ 2 * 10^5\n1 ≤ |t| ≤ |s|\nThe strings contain lowercase English letters; s may also contain '?'.\nThe sum of |s| over all test cases does not exceed 2 * 10^5.","examples":[{"input":"5\n?????\nxbx\nab??e\nabcde\nayy?x\na\nab??e\ndac\npaiu\nmom","output":"YES\nxabax\nYES\nabcde\nYES\nayyyx\nNO\nNO","explanation":"Official sample.\n\nTest 1: The question marks can be replaced so that xbx appears as a subsequence. One valid result is xabax.\n\nTest 2: The fixed characters already allow abcde to appear as a subsequence. Replace the question marks with b and c to produce abcde.\n\nTest 3: The target is a, which already appears in the string. Replace the remaining question mark with any lowercase letter, for example y.\n\nTest 4: The fixed character order cannot produce dac, so the answer is NO.\n\nTest 5: The string paiu does not contain enough matching characters to form mom, and there are no question marks to replace."},{"input":"3\n????\nabc\na?b\nacb\nabc\nacb","output":"YES\nabca\nYES\nacb\nNO","explanation":"Additional test cases (generated).\n\nTest 1: Replace the first three question marks with a, b, c. The resulting string abca contains abc as a subsequence.\n\nTest 2: The fixed a and b characters can match the first and last characters of acb, while the question mark is replaced with c.\n\nTest 3: The fixed string abc cannot produce acb because its character order is incorrect and there are no replaceable positions."},{"input":"2\n??\naa\nabc\nabc","output":"YES\naa\nYES\nabc","explanation":"Additional test cases (generated).\n\nTest 1: Both question marks can be replaced with a, producing aa.\n\nTest 2: No question marks exist, but the string already equals the target and is therefore its own subsequence."}],"approach":"Use a greedy subsequence-matching algorithm with a pointer j representing the next character of t that must be matched.\n\nTraverse s from left to right.\n\nIf the current character is '?':\n\n- If there are still unmatched characters in t, replace '?' with t[j] and advance j.\n- Otherwise, replace '?' with 'a' because all target characters have already been matched.\n\nIf the current character is a normal letter:\n\n- If it equals t[j], advance j.\n- Otherwise, leave it unchanged and continue searching.\n\nAfter traversing the entire string:\n\n- If j equals the length of t, every character of t has been matched in order, so print YES and the resulting string.\n- Otherwise, print NO.","reasoning":"The main challenge is deciding what letter to place at each question mark.\n\nWe need t to appear as a subsequence of s. That means we must find all characters of t in the correct order, but they do not need to occupy consecutive positions.\n\nWe can solve this by matching t from left to right.\n\nLet j represent the index of the next character in t that we still need.\n\nInitially, j = 0.\n\nCASE 1: THE CURRENT CHARACTER IS A FIXED LETTER.\n\nIf s[i] equals t[j], we can use this position to match the next required character. Therefore, increment j.\n\nIf they are different, we simply skip this position. We cannot change a fixed character.\n\nCASE 2: THE CURRENT CHARACTER IS '?'.\n\nUnlike fixed letters, question marks can be replaced with anything.\n\nIf we still need a character from t, the best choice is to replace the question mark with exactly t[j]. This immediately matches the next required character at the earliest available position.\n\nThen increment j.\n\nIf j has already reached the length of t, all target characters have been matched. The remaining question marks can be replaced with any lowercase letter, such as 'a'.\n\nWHY IS THE GREEDY CHOICE CORRECT?\n\nSuppose we need a particular target character and encounter a question mark.\n\nUsing this position immediately is always at least as good as leaving it for later. It gives us the earliest possible position for the required character, leaving more positions available for the remaining characters.\n\nA fixed character that does not match cannot be changed, so skipping it is the only possible choice.\n\nThus, the algorithm never loses a valid subsequence by matching the next required character at the earliest available question mark.\n\nFINAL CHECK:\n\nIf j reaches the length of t, every target character has been matched in order.\n\nOtherwise, there were not enough valid positions to build the subsequence, so the answer is NO.\n\nThe algorithm also constructs a complete valid string because every question mark is replaced during the traversal.","solution":"#include \u003ciostream>\nusing namespace std;\n\nint main() {\n    int tests;\n    cin >> tests;\n\n    while (tests--) {\n        string s, sub_sequence;\n        cin >> s >> sub_sequence;\n\n        int j = 0;\n\n        // Try to match t inside s\n        for (int i = 0; i \u003c s.size(); i++) {\n\n            if (s[i] == '?') {\n\n                // Replace ? with the next required character\n                if (j \u003c sub_sequence.size()) {\n                    s[i] = sub_sequence[j];\n                    j++;\n                }\n                else {\n                    // No more characters needed\n                    s[i] = 'a';\n                }\n            }\n\n            // Match a normal character\n            else if (j \u003c sub_sequence.size() && s[i] == sub_sequence[j]) {\n                j++;\n            }\n        }\n\n        if (j == sub_sequence.size()) {\n            cout \u003c\u003c \"YES\\n\";\n            cout \u003c\u003c s \u003c\u003c '\\n';\n        }\n        else {\n            cout \u003c\u003c \"NO\\n\";\n        }\n    }\n\n    return 0;\n}","timeComplexity":"O(|s| + |t|) per test case. The algorithm scans s once, and the target pointer advances at most |t| times. Since |t| ≤ |s|, this is also O(|s|).","spaceComplexity":"O(1) auxiliary space, excluding the input string s, which is modified in place.","notes":"1. A subsequence preserves the relative order of characters but does not require them to be adjacent.\n\n2. The variable j is the most important part of the solution. It tells us exactly which character of the target string we need to match next.\n\n3. Replacing a question mark with the next required target character is a greedy choice that uses the earliest available position.\n\n4. Once j reaches t.size(), the target subsequence is complete. All remaining question marks can safely become 'a'.\n\n5. The algorithm does not change any existing lowercase character because only question marks are allowed to be replaced.\n\n6. A successful result is not necessarily unique. The problem accepts any valid resulting string.\n\n7. The submitted solution uses std::string but does not explicitly include \u003cstring>. Adding that header is advisable for portable code.","relatedProblems":[],"createdAt":"2026-11-09T19:29:57.552Z","updatedAt":"2026-11-09T19:29:57.552Z"},{"id":"bcc50322-b25d-4d01-905d-e3b8aa8cacdf","title":"Email from Polycarp","problemId":"1185B","platform":"Codeforces","url":"https://codeforces.com/problemset/problem/1185/B","difficulty":"Easy","category":"Strings","tags":["Strings","Implementation","Two Pointers","Run-Length Encoding","Frequency Counting"],"shortDescription":"Determine whether a printed word could have been produced from an original word when each typed character may appear multiple consecutive times.","statement":"Methodius received an email from his friend Polycarp. However, Polycarp's keyboard is broken, so pressing a key once may cause the corresponding character to appear more than once.\n\nFor example, typing the word \"hello\" could produce \"hello\", \"hhhhello\", or \"hheeeellllooo\".\n\nHowever, it could not produce \"hell\", \"helo\", or \"hhllllooo\".\n\nWhen a key is pressed, its corresponding character must appear at least once and may appear multiple consecutive times. Different presses of the same key can produce different repetition counts.\n\nYou are given several pairs of words. For each pair, determine whether the second word could have been printed by typing the first word on the broken keyboard.","input":"The first line contains one integer n — the number of pairs to check.\n\nFor each pair, the first line contains a non-empty word s, representing the intended word.\n\nThe second line contains a non-empty word t, representing the printed word.","output":"For each pair, print YES if t could have been printed by typing s on the broken keyboard. Otherwise, print NO.","constraints":"1 ≤ n ≤ 10^5\n1 ≤ |s|, |t| ≤ 10^6\nThe total length of all strings s does not exceed 10^6.\nThe total length of all strings t does not exceed 10^6.\nAll characters are lowercase Latin letters.","examples":[{"input":"4\nhello\nhello\nhello\nhelloo\nhello\nhlllloo\nhello\nhelo","output":"YES\nYES\nNO\nNO","explanation":"Official sample.\n\n1. hello → hello: YES. Every character appears exactly as many times as needed.\n\n2. hello → helloo: YES. The final o appears twice instead of once.\n\n3. hello → hlllloo: NO. The original word contains two consecutive l characters, so the corresponding group in the output cannot contain fewer than two l characters. Here the original and target groups do not match correctly because the run structure differs.\n\n4. hello → helo: NO. The two consecutive l characters in the original word cannot be reduced to one."},{"input":"5\naa\nbb\ncodeforces\ncodeforce\npolycarp\npoolycarpp\naaaa\naaaab\nabcdefghijklmnopqrstuvwxyz\nzabcdefghijklmnopqrstuvwxyz","output":"NO\nNO\nYES\nNO\nNO","explanation":"Official sample.\n\n1. aa → bb: NO. The characters themselves differ.\n\n2. codeforces → codeforce: NO. The final s is missing.\n\n3. polycarp → poolycarpp: YES. The printed string contains valid repetitions of the original consecutive character groups.\n\n4. aaaa → aaaab: NO. The printed string contains an extra character group b.\n\n5. abcdefghijklmnopqrstuvwxyz → zabcdefghijklmnopqrstuvwxyz: NO. The characters appear in a different order."},{"input":"5\na\naa\naa\na\nabc\naabbcc\nab\nabb\nabc\nacb","output":"YES\nNO\nYES\nYES\nNO","explanation":"Additional test cases (generated).\n\n1. a → aa: YES. One press of a can produce two consecutive a characters.\n\n2. aa → a: NO. Two original presses must produce at least two a characters.\n\n3. abc → aabbcc: YES. Every original character appears in the correct order and can be repeated.\n\n4. ab → abb: YES. The b character is repeated.\n\n5. abc → acb: NO. The order of character groups has changed."}],"approach":"Use run-length encoding to compress each string into groups of consecutive identical characters.\n\nRepresent every group as a pair:\n(character, frequency)\n\nFor example:\n\ns = hello\n\nCompressed representation:\n(h,1), (e,1), (l,2), (o,1)\n\nAfter compressing both strings:\n\n1. Their numbers of groups must be equal.\n2. The character of each corresponding group must be equal.\n3. The target group's frequency must be greater than or equal to the original group's frequency.\n\nIf any condition fails, print NO.\n\nIf every group passes all three checks, print YES.","reasoning":"The keyboard malfunction only changes how many times a character appears when a key is pressed. It does not change the order of the key presses.\n\nThis gives us an important observation:\n\nEvery consecutive group of equal characters in the original word must correspond to exactly one consecutive group of the same character in the printed word.\n\nFor example:\n\nOriginal: hello\nPrinted: hheeeellllooo\n\nBreak the original string into groups:\n\n(h,1), (e,1), (l,2), (o,1)\n\nBreak the printed string into groups:\n\n(h,2), (e,4), (l,4), (o,3)\n\nThe group characters are identical, and every printed group is at least as large as its corresponding original group.\n\nTherefore, the printed word is possible.\n\nWHY MUST THE NUMBER OF GROUPS BE THE SAME?\n\nEach group represents one original key press.\n\nA key press can repeat its character, but it cannot turn into a different character or disappear.\n\nTherefore, the order and number of character groups cannot change.\n\nWHY MUST THE CHARACTERS MATCH?\n\nEvery original key press must produce its corresponding character. Repetition is allowed, but changing the character is not.\n\nWHY MUST THE TARGET FREQUENCY BE GREATER THAN OR EQUAL TO THE ORIGINAL FREQUENCY?\n\nEach original occurrence comes from at least one key press of that character.\n\nThe broken keyboard can produce extra repetitions, but it cannot produce fewer characters than the number of original presses.\n\nTherefore:\n\ntargetFrequency >= originalFrequency\n\nFINAL CONCLUSION:\n\nAfter run-length encoding both strings, compare their groups one by one. If all corresponding groups satisfy these conditions, the target string could have been printed. Otherwise, it could not.","solution":"#include \u003cbits/stdc++.h>\nusing namespace std;\n\nvector\u003cpair\u003cchar, int>> compress(string s) {\n    vector\u003cpair\u003cchar, int>> v;\n\n    for (int i = 0; i \u003c s.size(); i++) {\n        char c = s[i];\n        int cnt = 0;\n\n        while (i \u003c s.size() && s[i] == c) {\n            cnt++;\n            i++;\n        }\n\n        v.push_back({c, cnt});\n        i--;\n    }\n\n    return v;\n}\n\nbool canPrint(string s, string t) {\n    vector\u003cpair\u003cchar, int>> a = compress(s);\n    vector\u003cpair\u003cchar, int>> b = compress(t);\n\n    // Both strings must have the same number of groups\n    if (a.size() != b.size())\n        return false;\n\n    for (int i = 0; i \u003c a.size(); i++) {\n\n        // Characters must be equal\n        if (a[i].first != b[i].first)\n            return false;\n\n        // The printed group cannot be smaller\n        if (b[i].second \u003c a[i].second)\n            return false;\n    }\n\n    return true;\n}\n\nint main() {\n    int n;\n    cin >> n;\n\n    while (n--) {\n        string s, t;\n        cin >> s >> t;\n\n        cout \u003c\u003c (canPrint(s, t) ? \"YES\" : \"NO\") \u003c\u003c '\\n';\n    }\n\n    return 0;\n}","timeComplexity":"O(|s| + |t|) per pair. Each string is traversed once during compression, and the resulting group arrays are compared in linear time.","spaceComplexity":"O(|s| + |t|) auxiliary space in the worst case because both compressed strings can contain as many groups as characters.","notes":"1. Run-length encoding (RLE) is a technique that represents consecutive equal characters using their character and repetition count.\n\n2. The number of groups matters independently of the total string lengths. Repetition can increase a group's size but cannot introduce additional groups or remove existing ones.\n\n3. The condition for each matching group is targetCount >= originalCount, not equality. This is because the broken keyboard may repeat characters.\n\n4. Characters in corresponding groups must match exactly, and their group order must remain unchanged.\n\n5. The compression function uses i++ inside the while loop and then i-- after the group is completed. This adjustment ensures that the outer for loop begins at the next unprocessed character.\n\n6. The algorithm does not need to compare character frequencies globally. For example, the same total character frequencies are not sufficient if the order of consecutive groups is different.\n\n7. The solution preserves the original C++ implementation.","relatedProblems":[],"createdAt":"2026-11-09T19:30:09.162Z","updatedAt":"2026-11-09T19:30:09.162Z"},{"id":"adba0acf-b910-4578-a242-bdc90c6ad96f","title":"A Perfectly Balanced String?","problemId":"1673B","platform":"Codeforces","url":"https://codeforces.com/problemset/problem/1673/B","difficulty":"Easy","category":"Strings","tags":["Strings","Implementation","Character Frequencies","Periodicity","Set","Mathematical Observation"],"shortDescription":"Determine whether every substring has character frequencies differing by at most one for all characters present in the original string.","statement":"Let's call a string s perfectly balanced if, for every non-empty substring t of s and every pair of characters u and v that appear in s, the difference between their frequencies in t is at most 1.\n\nA substring is a contiguous sequence of characters that can be obtained by removing zero or more characters from the beginning and/or end of a string.\n\nYou are given a string s consisting only of lowercase English letters. Determine whether it is perfectly balanced.","input":"The first line contains a single integer t — the number of test cases.\n\nEach of the next t lines contains a string s.","output":"For each test case, print YES if s is perfectly balanced, and NO otherwise.","constraints":"1 ≤ t ≤ 2 * 10^4\n1 ≤ |s| ≤ 2 * 10^5\nAll characters are lowercase English letters.\nThe sum of |s| over all test cases does not exceed 2 * 10^5.","examples":[{"input":"5\naba\nabb\nabc\naaaaa\nabcba","output":"YES\nNO\nYES\nYES\nNO","explanation":"Official sample.\n\n1. aba: YES. Every substring has frequencies of a and b differing by at most one.\n\n2. abb: NO. The substring bb contains two occurrences of b and zero occurrences of a, so their frequency difference is 2.\n\n3. abc: YES. Every character occurs once, and every substring remains balanced.\n\n4. aaaaa: YES. Only one distinct character exists, so there is no pair of different characters whose frequencies can become unbalanced.\n\n5. abcba: NO. It does not repeat a block whose length equals its number of distinct characters."},{"input":"5\na\nabcdabcd\naabb\nabac\nabcabc","output":"YES\nYES\nNO\nNO\nYES","explanation":"Additional test cases (generated).\n\n1. a: YES. There is only one distinct character.\n\n2. abcdabcd: YES. There are four distinct characters and the string repeats the block abcd.\n\n3. aabb: NO. There are two distinct characters, but the second two-character block does not repeat the first one.\n\n4. abac: NO. There are three distinct characters, but the string does not repeat a block of length three.\n\n5. abcabc: YES. There are three distinct characters, and the block abc repeats exactly."}],"approach":"Count the number of distinct characters in the string using a set.\n\nLet d be the number of distinct characters.\n\nA perfectly balanced string must repeat a pattern of length d.\n\nTherefore, traverse the string starting from index d and compare each character with the character d positions before it:\n\ns[i] == s[i-d]\n\nIf every comparison succeeds, the string is perfectly balanced.\n\nIf any comparison fails, print NO.\n\nThe solution does not need to examine every possible substring. It uses the periodicity property to reduce the verification to a single linear traversal.","reasoning":"The original definition talks about every non-empty substring and every pair of characters present in the complete string.\n\nChecking all substrings directly would be unnecessarily expensive.\n\nThe important observation is that a perfectly balanced string has a very specific repeating structure.\n\nLet d be the number of distinct characters in the complete string.\n\nFor the string to remain balanced, every consecutive substring of length d must contain every distinct character exactly once.\n\nWhy?\n\nA substring of length d contains exactly d character positions, and there are d distinct characters in the entire string.\n\nIf one character appeared twice while another did not appear, their frequencies would differ by at least 2, violating the balance condition.\n\nTherefore, every block of length d must contain every distinct character exactly once.\n\nThis means the string must repeat its first d characters.\n\nEXAMPLE 1:\n\ns = abcabc\n\nDistinct characters:\n{a, b, c}\n\nd = 3\n\nThe repeating block is abc.\n\nWe check:\n\ns[3] == s[0] → a == a\ns[4] == s[1] → b == b\ns[5] == s[2] → c == c\n\nEvery comparison succeeds, so the string is perfectly balanced.\n\nEXAMPLE 2:\n\ns = abb\n\nDistinct characters:\n{a, b}\n\nd = 2\n\nCheck:\n\ns[2] == s[0]\n\nb != a\n\nThe repeating pattern does not hold, so the string is not perfectly balanced.\n\nWHY IS CHECKING PERIODICITY SUFFICIENT?\n\nIf the string repeats a block of length d containing d distinct characters, then each full block contains every distinct character exactly once.\n\nAny substring consists of some complete repetitions plus possibly a partial repetition.\n\nThe complete repetitions contribute equally to every character's frequency. The remaining partial block can contribute at most one additional occurrence to any character.\n\nTherefore, the frequency difference between any two characters in any substring cannot exceed one.\n\nThis establishes the equivalence between the original balance property and the simple periodicity check.","solution":"#include \u003cbits/stdc++.h>\nusing namespace std;\n\nint main() {\n    int t;\n    cin >> t;\n\n    while (t--) {\n        string s;\n        cin >> s;\n\n        // Count distinct characters\n        set\u003cchar> st(s.begin(), s.end());\n\n        int d = st.size();\n\n        bool ok = true;\n\n        // Check the repeating pattern\n        for (int i = d; i \u003c s.size(); i++) {\n            if (s[i] != s[i - d]) {\n                ok = false;\n                break;\n            }\n        }\n\n        cout \u003c\u003c (ok ? \"YES\" : \"NO\") \u003c\u003c '\\n';\n    }\n\n    return 0;\n}","timeComplexity":"O(n) per test case, with a constant alphabet of 26 lowercase English letters. The set operations are O(log 26), which is constant for this problem, and the periodicity check is linear.","spaceComplexity":"O(1) auxiliary space because the set can contain at most 26 distinct lowercase English letters.","notes":"1. The key observation is that the repeating block length must equal the total number of distinct characters in the complete string.\n\n2. The set is used to count distinct characters, not to calculate character frequencies.\n\n3. The comparison s[i] == s[i-d] verifies that the string repeats with period d.\n\n4. The periodicity condition is sufficient because every full block contains all distinct characters exactly once, while a partial block can contribute at most one extra occurrence per character.\n\n5. If the string contains only one distinct character, d = 1. Every character is equal to the one before it, so the string is automatically perfectly balanced.\n\n6. The algorithm avoids explicitly generating or checking all substrings, which would be much more expensive.","relatedProblems":[],"createdAt":"2026-11-09T19:30:19.746Z","updatedAt":"2026-11-09T19:30:19.746Z"},{"id":"0b0132b9-5906-4048-8f7e-dd4bc6d76ef8","title":"The Shortest Path","problemId":"SHPATH","platform":"SPOJ","url":"https://www.spoj.com/problems/SHPATH/","difficulty":"Medium","category":"Graphs","tags":["Graphs","Shortest Path","Dijkstra","Priority Queue","Adjacency List","Hash Map","Weighted Graph"],"shortDescription":"Find the minimum transportation cost between pairs of cities in a weighted graph using Dijkstra's shortest path algorithm.","statement":"You are given a list of cities. Each direct connection between two cities has a positive transportation cost represented by an integer.\n\nThe cost of a path is the sum of the costs of all direct connections belonging to that path.\n\nYour task is to find the paths of minimum cost between several pairs of cities.\n\nEach city has a unique name, and connections are provided using the numerical indices of the cities.","input":"The first line contains s, the number of test cases.\n\nFor each test case:\n\n1. Read n, the number of cities.\n2. For each city, read its name and p, the number of neighboring cities.\n3. Read p pairs of integers nr and cost, where nr is the index of a neighboring city and cost is the transportation cost to that city.\n4. Read r, the number of shortest-path queries.\n5. Read r pairs of city names, representing the source and destination of each query.\n\nThe first city has index 1.","output":"For each query, print the minimum transportation cost from the source city to the destination city, one result per line.","constraints":"s ≤ 10\n1 ≤ n ≤ 10000\nr ≤ 100\nCity names contain lowercase English letters and have at most 10 characters.\nDirect connection costs are positive integers.\nThe cost of a path is at most 200000, according to the provided statement.","examples":[{"input":"1\n4\ngdansk 2\n2 1\n3 3\nbydgoszcz 3\n1 1\n3 1\n4 4\ntorun 3\n1 3\n2 1\n4 1\nwarszawa 2\n2 4\n3 1\n2\ngdansk warszawa\nbydgoszcz warszawa","output":"3\n2","explanation":"Official sample.\n\nThere are four cities: gdansk, bydgoszcz, torun, and warszawa.\n\nQuery 1: gdansk → warszawa.\n\nA shortest route is:\ngdansk → bydgoszcz → torun → warszawa\n\nTotal cost = 1 + 1 + 1 = 3.\n\nQuery 2: bydgoszcz → warszawa.\n\nA shortest route is:\nbydgoszcz → torun → warszawa\n\nTotal cost = 1 + 1 = 2."},{"input":"1\n3\nalpha 2\n2 4\n3 10\nbeta 1\n3 2\ngamma 0\n2\nalpha gamma\nbeta gamma","output":"6\n2","explanation":"Additional test case (generated).\n\nThe first city alpha has two outgoing connections:\nalpha → beta with cost 4.\nalpha → gamma with cost 10.\n\nThe city beta also connects to gamma with cost 2.\n\nFor alpha → gamma, the direct route costs 10, but the route alpha → beta → gamma costs 4 + 2 = 6. Therefore, the answer is 6.\n\nFor beta → gamma, the answer is 2."},{"input":"1\n3\nsource 2\n2 5\n3 20\nmiddle 1\n3 3\ntarget 0\n2\nsource target\nsource middle","output":"8\n5","explanation":"Additional test case (generated).\n\nFor source → target, the direct connection costs 20, but the route source → middle → target costs 5 + 3 = 8.\n\nFor source → middle, the direct connection costs 5."}],"approach":"Use Dijkstra's algorithm with an adjacency list to find the shortest path for each query.\n\nFIRST: BUILD THE GRAPH.\n\nEach city is assigned an integer index from 1 to n.\n\nStore its outgoing connections in an adjacency list:\n\nadj[u] = {(v1, w1), (v2, w2), ...}\n\nEach pair stores a neighboring city and the cost of reaching it.\n\nBecause queries provide city names instead of indices, use an unordered_map to map each city name to its numerical ID.\n\nSECOND: RUN DIJKSTRA FOR EACH QUERY.\n\nFor every source and destination pair:\n\n1. Initialize all distances to infinity.\n2. Set the source distance to zero.\n3. Insert the source into a min-priority queue as {distance, node}.\n4. Repeatedly extract the node with the smallest known distance.\n5. Ignore outdated queue entries.\n6. Relax all outgoing edges by checking whether the current route gives a shorter distance.\n7. If the destination is extracted with its current shortest distance, return it immediately.\n\nIf the queue becomes empty without reaching the destination, return -1.\n\nThe same graph is reused for all queries, but the distance array and priority queue are initialized separately for every query.","reasoning":"The problem asks for the minimum total cost between two cities.\n\nEach city can be represented as a graph vertex, while each direct connection represents a weighted edge.\n\nSince all transportation costs are positive, Dijkstra's algorithm is suitable.\n\nFIRST: WHY DO WE NEED A GRAPH?\n\nConsider three cities:\n\nA → B with cost 4\nB → C with cost 3\nA → C with cost 10\n\nThere are two ways to reach C from A:\n\nDirectly: cost 10.\n\nThrough B: cost 4 + 3 = 7.\n\nThe shortest path is the second route, with total cost 7.\n\nThis is exactly the type of problem solved by shortest-path algorithms.\n\nSECOND: WHY USE AN ADJACENCY LIST?\n\nEach city may connect to several other cities.\n\nAn adjacency list stores only the edges that actually exist.\n\nFor example:\n\nadj[A] = {(B,4), (C,10)}\nadj[B] = {(C,3)}\nadj[C] = {}\n\nThis representation allows us to efficiently iterate over the outgoing connections of a city.\n\nTHIRD: HOW DOES DIJKSTRA WORK?\n\nWe maintain a distance array where dist[u] represents the smallest known cost from the source to city u.\n\nInitially, all distances are infinity except the source:\n\ndist[source] = 0\n\nWe use a min-priority queue to always process the currently closest available city.\n\nSuppose we extract city u with distance d.\n\nFor every outgoing edge from u to v with weight w, calculate:\n\nnewDist = d + w\n\nIf:\n\nnewDist \u003c dist[v]\n\nthen we found a better route, so we update dist[v] and push the new distance into the priority queue.\n\nThis process is called relaxation.\n\nFOURTH: WHY SKIP OUTDATED QUEUE ENTRIES?\n\nThe priority queue may contain multiple entries for the same city because its distance can improve several times.\n\nFor example, we may initially discover a route of cost 10 and later discover a better route of cost 6.\n\nThe old entry with cost 10 remains in the queue.\n\nWhen it is eventually extracted, we compare its distance with the latest distance:\n\nif (d != dist[u]) continue;\n\nIf they differ, the entry is outdated and can be ignored.\n\nFIFTH: WHY CAN WE STOP WHEN THE DESTINATION IS EXTRACTED?\n\nDijkstra processes nodes in non-decreasing order of their shortest known distances.\n\nWith non-negative edge weights, when the destination is extracted using its current distance, no remaining route can improve that distance.\n\nTherefore, we can return immediately without processing the rest of the graph.\n\nSIXTH: WHY DO WE USE CITY NAME MAPPING?\n\nThe input identifies query endpoints using strings such as gdansk and warszawa.\n\nHowever, the graph uses integer indices to identify vertices.\n\nAn unordered_map converts city names into their corresponding indices efficiently.\n\nThis allows us to use the graph without repeatedly searching through all city names.","solution":"#include \u003ciostream>\n#include \u003cvector>\n#include \u003cqueue>\n#include \u003cmap>\n#include \u003cunordered_map>\nusing namespace std;\n\nconst long long INF = 1e18;\n\n// Find the shortest path from src to dest\nlong long dijkstra(int src, int dest,\n    vector\u003cvector\u003cpair\u003cint, int>>>& adj) {\n\n    int n = adj.size();\n\n    vector\u003clong long> dist(n, INF);\n\n    // Min Heap: {distance, node}\n    priority_queue\u003c\n        pair\u003clong long, int>,\n        vector\u003cpair\u003clong long, int>>,\n        greater\u003cpair\u003clong long, int>>\n    > pq;\n\n    // Distance from the source to itself is 0\n    dist[src] = 0;\n    pq.push({ 0, src });\n\n    while (!pq.empty()) {\n\n        // Get the node with the smallest distance\n\n        //auto [d, u] = pq.top();\n        auto node = pq.top();\n        auto d = node.first;\n        auto u = node.second;\n        pq.pop();\n\n        // Skip outdated entries\n        if (d != dist[u])\n            continue;\n\n        // We reached the destination\n        if (u == dest)\n            return d;\n\n        // Check all outgoing edges\n        for (auto edge : adj[u]) {\n\n            int w = edge.second;\n            int v = edge.first;\n\n            long long newDist = d + w;\n\n            // Can we reach v with a cheaper cost?\n            if (newDist \u003c dist[v]) {\n\n                dist[v] = newDist;\n\n                pq.push({ newDist, v });\n            }\n        }\n    }\n\n    return -1;\n}\n\nint main() {\n    ios::sync_with_stdio(false);\n    cin.tie(nullptr);\n\n    int t;\n    cin >> t;\n\n    while (t--) {\n\n        int n;\n        cin >> n;\n\n        // Adjacency list\n        vector\u003cvector\u003cpair\u003cint, int>>> adj(n + 1);\n\n        // Map city names to their numerical IDs\n        unordered_map\u003cstring, int> cityId;\n\n        // Read all cities and their connections\n        for (int i = 1; i \u003c= n; i++) {\n\n            string name;\n            int p;\n\n            cin >> name >> p;\n\n            cityId[name] = i;\n\n            for (int j = 0; j \u003c p; j++) {\n\n                int nr, cost;\n                cin >> nr >> cost;\n\n                adj[i].push_back({ nr, cost });\n            }\n        }\n\n        // Read the number of queries\n        int r;\n        cin >> r;\n\n        while (r--) {\n\n            string sourceName, destinationName;\n            cin >> sourceName >> destinationName;\n\n            int src = cityId[sourceName];\n            int dest = cityId[destinationName];\n\n            cout \u003c\u003c dijkstra(src, dest, adj) \u003c\u003c '\\n';\n        }\n    }\n\n    return 0;\n}","timeComplexity":"O(R * (V + E) * log V) per test case, where V is the number of cities, E is the number of connections, and R is the number of queries. Each query runs Dijkstra independently. The destination early-exit optimization may reduce the actual work.","spaceComplexity":"O(V + E) for the adjacency list, city-name map, distance array, and priority queue.","notes":"1. Dijkstra's algorithm requires non-negative edge weights. This problem specifies positive transportation costs, so the requirement is satisfied.\n\n2. The graph is built once per test case and reused for all shortest-path queries. However, this implementation runs Dijkstra separately for each query rather than caching previous results.\n\n3. The unordered_map maps city names to integer IDs with average O(1) lookup time.\n\n4. The adjacency list uses 1-based city indices, which matches the problem's numbering. Consequently, it has n + 1 entries.\n\n5. The priority queue stores pairs {distance, node} and uses greater\u003cpair\u003clong long,int>> to create a min-heap.\n\n6. INF is defined as 1e18 and the distance array uses long long to avoid distance overflow.\n\n7. The function returns -1 if the destination cannot be reached. The provided problem statement does not explicitly define an output for unreachable queries, so the actual judge's reachability guarantee should be considered.\n\n8. The submitted solution includes \u003cmap>, although it uses unordered_map instead. The extra include is harmless but unnecessary.\n\n9. The local variable n inside dijkstra is not used. It does not affect the solution's correctness.","relatedProblems":[],"createdAt":"2026-11-09T19:33:41.721Z","updatedAt":"2026-11-09T19:33:41.721Z"},{"id":"84f18697-753a-484c-9c7b-11e62b3d8289","title":"Sending Email","problemId":"10986","platform":"UVA","url":"https://onlinejudge.org/external/109/10986.pdf","difficulty":"Medium","category":"Graphs","tags":["Graphs","Dijkstra","Shortest Path","Priority Queue","Undirected Graph","Weighted Graph","Minimum Distance"],"shortDescription":"Find the minimum communication latency between two email servers in an undirected weighted network, or report that they are unreachable.","statement":"There are n SMTP servers connected by network cables. Each cable connects two different servers and has a certain latency measured in milliseconds, representing the time required to send an email through that connection.\n\nWhat is the shortest time required to send a message from server S to server T along a sequence of cables?\n\nAssume that there is no delay incurred at any of the servers.\n\nIf there is no path connecting S and T, report that the destination is unreachable.","input":"The first line contains the number of test cases N.\n\nEach test case begins with four integers:\n\nn — the number of servers.\nm — the number of bidirectional cables.\nS — the source server.\nT — the destination server.\n\nThe next m lines each contain three integers:\n\nu, v, w\n\nThis represents a bidirectional connection between servers u and v with latency w.","output":"For each test case, print:\n\nCase #x: followed by the minimum distance from S to T.\n\nIf there is no route from S to T, print unreachable instead of a distance.","constraints":"1 ≤ N\n2 ≤ n ≤ 20000\n0 ≤ m ≤ 50000\n0 ≤ S,T \u003c n\nS ≠ T\n0 ≤ w ≤ 10000\nAll connections are bidirectional.\n","examples":[{"input":"3\n2 1 0 1\n0 1 100\n3 3 2 0\n0 1 100\n0 2 200\n1 2 50\n2 0 0 1","output":"Case #1: 100\nCase #2: 150\nCase #3: unreachable","explanation":"Official sample.\n\nTest 1:\nThere is only one cable connecting servers 0 and 1, with latency 100.\nAnswer: 100.\n\nTest 2:\nWe need to travel from server 2 to server 0.\n\nThe direct connection costs 200.\n\nThe alternative route is:\n2 → 1 → 0\n\nIts cost is 50 + 100 = 150.\n\nAnswer: 150.\n\nTest 3:\nThere are no cables, so there is no route from server 0 to server 1.\nAnswer: unreachable."},{"input":"3\n2 1 0 1\n0 1 0\n4 3 3 0\n3 2 5\n2 1 2\n1 0 3\n3 1 0 2\n0 1 7","output":"Case #1: 0\nCase #2: 10\nCase #3: unreachable","explanation":"Additional test cases (generated).\n\nTest 1: A cable with zero latency connects the two servers directly. The shortest distance is 0.\n\nTest 2: The source ID is greater than the destination ID. The route 3 → 2 → 1 → 0 costs 5 + 2 + 3 = 10.\n\nTest 3: The destination is disconnected from the source, so the correct output is unreachable."},{"input":"1\n5 6 0 4\n0 1 10\n0 2 3\n2 1 2\n1 3 4\n2 3 8\n3 4 1","output":"Case #1: 10","explanation":"Additional test case (generated).\n\nThere are multiple possible routes from server 0 to server 4.\n\nThe shortest route is:\n0 → 2 → 1 → 3 → 4\n\nTotal cost = 3 + 2 + 4 + 1 = 10.\n\nThis test checks whether the algorithm correctly updates previously discovered distances when a cheaper route is found."}],"approach":"Use Dijkstra's algorithm with an adjacency list and a priority queue.\n\nFIRST: BUILD THE UNDIRECTED GRAPH.\n\nFor each connection (u, v, w), add two edges:\n\nu → v with weight w\nv → u with weight w\n\nThis is necessary because every cable is bidirectional.\n\nSECOND: INITIALIZE DISTANCES.\n\nSet all distances to infinity and the source distance to zero.\n\nTHIRD: RUN DIJKSTRA.\n\nUse a priority queue containing pairs of negative distance and vertex ID.\n\nBecause C++ priority_queue is a max-heap by default, storing negative distances allows the largest negative value (corresponding to the smallest real distance) to be processed first.\n\nFor every extracted vertex:\n\n- Skip outdated entries.\n- Visit all adjacent vertices.\n- Calculate the new possible distance.\n- If it improves the current distance, update the array and insert the new entry.\n\nFOURTH: CHECK THE DESTINATION.\n\nAfter Dijkstra finishes, inspect the destination's distance.\n\n- If it is still INF, the destination is unreachable.\n- Otherwise, print the shortest distance.\n\nThe implementation uses the symmetry of an undirected graph: it runs Dijkstra from the endpoint with the smaller numerical ID and reads the distance to the other endpoint.","reasoning":"The problem describes a network of servers connected by cables, where every cable has a non-negative latency.\n\nThis is a weighted undirected graph:\n\n- Each server is a vertex.\n- Each cable is an edge.\n- Each latency is the edge weight.\n\nWe need the minimum total weight between two specified vertices.\n\nWHY DIJKSTRA?\n\nDijkstra's algorithm finds shortest paths in graphs with non-negative edge weights.\n\nThis problem allows zero latency but does not allow negative latency. Therefore, Dijkstra is valid.\n\nWHY ADD EVERY EDGE TWICE?\n\nThe problem explicitly states that every cable connects two servers bidirectionally.\n\nIf server u is connected to v, we must be able to travel both ways:\n\nu → v\nv → u\n\nTherefore, each input edge must be inserted into both adjacency lists.\n\nWHY USE A PRIORITY QUEUE?\n\nAt every stage, we want to process the currently closest unprocessed vertex.\n\nA priority queue efficiently retrieves this vertex.\n\nThe submitted solution uses a default max-heap, but stores negative distances:\n\npq.push({-distance, node})\n\nConsider two distances:\n\nDistance 5 is stored as -5.\nDistance 10 is stored as -10.\n\nBecause -5 is greater than -10, the max-heap extracts the smaller actual distance first.\n\nThis effectively turns the max-heap into a min-heap.\n\nWHY IGNORE OUTDATED ENTRIES?\n\nA vertex may enter the priority queue several times as better routes are discovered.\n\nFor example, we may first discover a path of cost 20 and later discover a path of cost 12.\n\nThe old entry remains in the queue.\n\nWhen it is removed, the condition:\n\nd > dis[current_Node]\n\nidentifies that the entry is no longer useful.\n\nWe skip it and continue.\n\nWHY CAN WE START FROM EITHER ENDPOINT?\n\nIn this problem the graph is undirected.\n\nEvery path from S to T can be traversed in reverse from T to S with exactly the same total cost.\n\nTherefore:\n\ndistance(S,T) = distance(T,S)\n\nThe implementation checks whether start is smaller than end and chooses one endpoint as the source. Either choice produces the same answer.\n\nHOW DO WE DETECT UNREACHABLE SERVERS?\n\nIf Dijkstra finishes and the destination still has its initial IN
