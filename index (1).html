<!DOCTYPE html>
<html lang="en"><head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SolveLog — Problem Solving Archive</title>
<style>
:root{--bg:#f4f6f8;--surface:#fff;--ink:#162029;--muted:#5b6874;--border:#dde3e9;--accent:#0e7c86;--on-accent:#fff;--soft:#e9f3f4;--code-bg:#fbfcfd;

--easy:#6cc68e;--medium:#e0b25a;--hard:#e48a8a;--sh:none;--t-kw:#c58af0;--t-ty:#6cc3ee;--t-st:#e6a074;--t-cm:#7d8b96;--t-nu:#8bd6a7;--t-pp:#e58ab8}
*{box-sizing:border-box}html{scroll-padding-top:4.5rem}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);overflow-x:hidden}
a{color:var(--accent)}h1,h2,h3{line-height:1.25;margin:0 0 .5em}h1,h2{font-family:var(--serif);font-weight:700;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 0}
.brand{font:700 1.35rem var(--serif);color:var(--ink);text-decoration:none}.brand b{color:var(--accent)}
nav{display:flex;gap:4px;overflow-x:auto;flex:1}nav a{padding:6px 12px;border-radius:var(--r-sm);color:var(--muted);text-decoration:none;white-space:nowrap}
nav a:hover,nav a[aria-current=page]{background:var(--soft);color:var(--ink)}
.btn{font:inherit;font-size:.92rem;padding:7px 14px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--accent)}.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}.btn.dan{color:var(--hard);border-color:var(--hard)}.btn.sm{padding:3px 9px;font-size:.82rem}

textarea{min-height:90px;resize:vertical}textarea.big{min-height:200px}textarea.code{font:.88rem/1.5 var(--mono);min-height:280px;tab-size:4;white-space:pre}

.pn{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:16px 0 40px}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}td.t{white-space:normal;min-width:180px}.acts{display:flex;gap:6px}
.chip{font-size:.82rem;padding:3px 10px;border-radius:99px;background:var(--soft)}.chip.warn{color:var(--hard);border:1px solid var(--hard);background:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}.ex{border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;margin-bottom:12px}

<script id="embedded-problems" type="application/json">{"schemaVersion":1,"problems":[{"id":"26c1123c-a8ac-4008-a4c5-d5d986e839bf","title":"ببيسبيس","problemId":"بيسبيس","platform":"بيس","url":"","difficulty":"Medium","category":"يسبيسبسي","tags":["بيسب"],"shortDescription":"سيب","statement":"يسبيس","input":"","output":"","constraints":"","examples":[],"approach":"","reasoning":"","solution":"","timeComplexity":"سيب","spaceComplexity":"سيبيسب","notes":"ررءر","relatedProblems":[],"createdAt":"2026-11-09T16:59:36.121Z","updatedAt":"2026-11-09T16:59:36.121Z"}]}</script>
<script>
"use strict";
/* Snapshot the pristine document before anything renders; Export HTML is built from this. */
const SOURCE_HTML = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
const DATA_OPEN = '<script id="embedded-problems" type="application/json">', DATA_CLOSE = '<\/script>';
const SCHEMA = 1, DIFFS = ["Easy", "Medium", "Hard"], DRAFT_KEY = "solvelog.draft.v1", BACKUP_KEY = "solvelog.draftBackup", THEME_KEY = "solvelog.theme";
const IS_LOCAL = window.location.protocol === "file:"; // authoring convenience only, not security

/* ---------- Utilities ---------- */
function h(tag, a, ...kids) {
  const e = document.createElement(tag);
  for (const k in a || {}) { const v = a[k]; if (v == null || v === false) continue;

    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v); }

  return e;
}
const $ = (s, r = document) => r.querySelector(s);
const uniq = a => [...new Set(a)];
const nowISO = () => new Date().toISOString();
const fmtDate = s => s ? new Date(s).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "";
function fingerprint(problems) { // FNV-1a over canonical JSON

function download(name, text, type) {

  const a = h("a", { href: url, download: name }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function copyText(text) {
  const done = () => Toast.show("Copied to clipboard");
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => fallback());
  else fallback();
  function fallback() { const t = h("textarea", { style: "position:fixed;opacity:0" }); t.value = text; document.body.append(t); t.select();
    try { document.execCommand("copy"); done(); } catch (e) { Toast.show("Copy failed — select the text manually", true); } t.remove(); }
}
function uid(existing) {
  let id; do { id = (crypto.randomUUID ? crypto.randomUUID() : "p-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10)); } while (existing.has(id));
  return id;
}

/* ---------- Toasts & dialogs ---------- */
const Toast = { show(msg, bad) { const t = h("div", { class: "toast" + (bad ? " bad" : ""), text: msg }); $("#toasts").append(t); setTimeout(() => t.remove(), bad ? 6000 : 3000); } };
function ask({ title, body, actions }) { // resolves with the clicked action's value, or null on Esc
  return new Promise(res => {
    const d = h("dialog", { "aria-labelledby": "dlg-t" }, h("h2", { id: "dlg-t", text: title }), h("div", {}, body),
      h("div", { class: "dact" }, actions.map(a => h("button", { class: "btn " + (a.kind || ""), type: "button", onclick: () => d.close(a.value) }, a.label))));
    d.addEventListener("close", () => { const v = d.returnValue; d.remove(); res(v === "" ? null : v); });
    document.body.append(d); d.showModal();
  });
}
const confirmDlg = (title, text, label, kind) => ask({ title, body: h("p", { text }), actions: [{ label: "Cancel", value: "no" }, { label, kind: kind || "pri", value: "yes" }] }).then(v => v === "yes");

/* ---------- Validation / normalization ---------- */
const str = v => typeof v === "string" ? v : (v == null ? "" : String(v));
function normalizeProblem(p, existingIds) {
  if (!p || typeof p !== "object" || Array.isArray(p)) throw new Error("Problem entry is not an object.");
  const title = str(p.title).trim(); if (!title) throw new Error("A problem is missing its title.");
  if (!DIFFS.includes(p.difficulty)) throw new Error(`"${title}": difficulty must be Easy, Medium or Hard.`);
  if (!str(p.category).trim()) throw new Error(`"${title}": category is required.`);
  const now = nowISO();
  return {
    id: str(p.id) || uid(existingIds || new Set()), title, problemId: str(p.problemId).trim(), platform: str(p.platform).trim(), url: str(p.url).trim(),
    difficulty: p.difficulty, category: str(p.category).trim(), tags: (Array.isArray(p.tags) ? p.tags : []).map(t => str(t).trim()).filter(Boolean),
    shortDescription: str(p.shortDescription), statement: str(p.statement), input: str(p.input), output: str(p.output), constraints: str(p.constraints),
    examples: (Array.isArray(p.examples) ? p.examples : []).map(e => ({ input: str(e && e.input), output: str(e && e.output), explanation: str(e && e.explanation) })),
    approach: str(p.approach), reasoning: str(p.reasoning), solution: str(p.solution), timeComplexity: str(p.timeComplexity), spaceComplexity: str(p.spaceComplexity),
    notes: str(p.notes), relatedProblems: (Array.isArray(p.relatedProblems) ? p.relatedProblems : []).map(str), createdAt: str(p.createdAt) || now, updatedAt: str(p.updatedAt) || str(p.createdAt) || now
  };
}
function normalizeDataset(raw) {
  if (!raw || typeof raw !== "object" || !Array.isArray(raw.problems)) throw new Error("File is not a SolveLog dataset (missing problems array).");
  if (raw.schemaVersion !== SCHEMA) throw new Error(`Unsupported schema version ${raw.schemaVersion}; this app reads version ${SCHEMA}.`);
  const seen = new Set(), out = [];
  for (const p of raw.problems) { const n = normalizeProblem(p, seen); if (seen.has(n.id)) throw new Error(`Duplicate internal id "${n.id}" in dataset.`); seen.add(n.id); out.push(n); }
  return out;
}
function validUrl(u) { try { const x = new URL(u); return x.protocol === "http:" || x.protocol === "https:"; } catch (e) { return false; } }

/* ---------- Storage (best-effort localStorage) ---------- */
const Storage = {
  ok: true,
  read(k) { try { return localStorage.getItem(k); } catch (e) { this.ok = false; return null; } },
  write(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { this.ok = false; return false; } },
  remove(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
};

/* ---------- Data store ---------- */
const Store = {
  problems: [], baseFp: "", unsafe: false, // unsafe = changes exist that are not persisted anywhere
  loadEmbedded() {
    try { return normalizeDataset(JSON.parse($("#embedded-problems").textContent)); }
    catch (e) { Toast.show("Embedded dataset is invalid: " + e.message, true); return []; }
  },
  async init() {
    const embedded = this.loadEmbedded(), efp = fingerprint(embedded);

    const raw = Storage.read(DRAFT_KEY); if (!raw) return;
    let draft; try { draft = { ...JSON.parse(raw) }; draft.list = normalizeDataset(draft.data); } catch (e) { Toast.show("Saved draft is unreadable and was left untouched.", true); return; }

    if (draft.base === efp) { this.problems = draft.list; return; }       // normal case: draft built on this file
    const choice = await ask({ title: "Saved draft differs from this file",
      body: [h("p", { text: `This browser holds a local draft (${draft.list.length} problems, saved ${fmtDate(draft.savedAt)}) that was not based on this file's embedded dataset (${embedded.length} problems).` }),
        h("p", { text: "Recover draft: continue with the draft. The embedded data stays in the file. Use embedded: start from this file; the draft is kept as a backup in this browser." })],
      actions: [{ label: "Use embedded", value: "emb" }, { label: "Recover draft", kind: "pri", value: "draft" }] });
    if (choice === "draft") { this.problems = draft.list; this.baseFp = draft.base; } // keep its base so the mismatch remains visible
    else { Storage.write(BACKUP_KEY, raw); Storage.write(DRAFT_KEY, JSON.stringify({ base: efp, savedAt: nowISO(), data: { schemaVersion: SCHEMA, problems: embedded } })); }
  },
  persist() {
    const ok = Storage.write(DRAFT_KEY, JSON.stringify({ base: this.baseFp, savedAt: nowISO(), data: { schemaVersion: SCHEMA, problems: this.problems } }));
    this.unsafe = !ok; Admin.refreshStatus(); return ok;
  },
  commit(msg) { // explicit user action: apply + persist
    const ok = this.persist();
    Toast.show(ok ? msg : "Saved in memory only — browser storage is unavailable. Export before closing.", !ok);
  },
  save(p) { const i = this.problems.findIndex(x => x.id === p.id); if (i < 0) this.problems.push(p); else this.problems[i] = p; this.commit("Problem saved"); },
  remove(id) { this.problems = this.problems.filter(p => p.id !== id); this.commit("Problem deleted"); },
  get(id) { return this.problems.find(p => p.id === id); },
  dataset() { return { schemaVersion: SCHEMA, problems: this.problems }; }
};

/* ---------- Import / Export ---------- */
const IO = {
  exportHTML() {
    try {
      const list = normalizeDataset(Store.dataset());
      const s = SOURCE_HTML.indexOf(DATA_OPEN); if (s < 0) throw new Error("Embedded data element not found in source.");
      const e = SOURCE_HTML.indexOf(DATA_CLOSE, s + DATA_OPEN.length); if (e < 0) throw new Error("Embedded data element is not terminated.");
      const html = SOURCE_HTML.slice(0, s + DATA_OPEN.length) + serialize({ schemaVersion: SCHEMA, problems: list }) + SOURCE_HTML.slice(e);
      const check = JSON.parse(html.slice(s + DATA_OPEN.length, html.indexOf(DATA_CLOSE, s + DATA_OPEN.length))); // verify round-trip
      if (fingerprint(normalizeDataset(check)) !== fingerprint(list)) throw new Error("Round-trip verification failed.");
      download("index.html", html, "text/html");
      Store.baseFp = fingerprint(list); Store.persist(); // draft now based on the exported dataset
      Toast.show("Exported index.html — upload it to GitHub Pages");
    } catch (err) { Toast.show("Export failed: " + err.message, true); }
  },
  exportJSON() { download("solvelog-backup-" + new Date().toISOString().slice(0, 10) + ".json", JSON.stringify(Store.dataset(), null, 2), "application/json"); Toast.show("JSON backup downloaded"); },
  importJSON() {
    const inp = h("input", { type: "file", accept: ".json,application/json" });
    inp.addEventListener("change", async () => {
      const f = inp.files[0]; if (!f) return;
      let incoming; try { incoming = normalizeDataset(JSON.parse(await f.text())); } catch (err) { Toast.show("Import rejected: " + err.message, true); return; }
      const have = new Set(Store.problems.map(p => p.id)), dupes = incoming.filter(p => have.has(p.id)).length;
      const choice = await ask({ title: "Import preview", body: [h("p", { text: `${incoming.length} problems in file; ${dupes} share an ID with your current ${Store.problems.length}.` }),
        h("p", { text: "Merge keeps your problems and overwrites those with matching IDs. Replace discards the current working dataset." })],
        actions: [{ label: "Cancel", value: "no" }, { label: "Merge", value: "merge" }, { label: "Replace all", kind: "dan", value: "replace" }] });
      if (choice === "merge") { const m = new Map(Store.problems.map(p => [p.id, p])); incoming.forEach(p => m.set(p.id, p)); Store.problems = [...m.values()]; Store.commit("Imported and merged"); Router.render(); }
      else if (choice === "replace") { if (await confirmDlg("Replace everything?", `This replaces all ${Store.problems.length} current problems with ${incoming.length} imported ones. Export a backup first if unsure.`, "Replace", "dan")) { Store.problems = incoming; Store.commit("Dataset replaced"); Router.render(); } }
    });
    inp.click();
  }
};

/* ---------- C++ syntax highlighter (tokenizer, no regex replace on HTML) ---------- */

const RULES = [["c", /\/\*[\s\S]*?(?:\*\/|$)/y], ["c", /\/\/[^\n]*/y], ["p", /#[ \t]*include[ \t]*(?:<[^>\n]*>|"[^"\n]*")/y], ["p", /#[ \t]*[A-Za-z_]+/y],
  ["s", /(?:u8|[uUL])?"(?:\\.|[^"\\\n])*"?/y], ["s", /'(?:\\.|[^'\\\n])*'?/y],
  ["n", /(?:0[xX][\da-fA-F']+|0[bB][01']+|(?:\d[\d']*\.?[\d']*|\.\d+)(?:[eE][+-]?\d+)?)[uUlLfF]*/y],
  ["i", /[A-Za-z_]\w*/y], ["o", /[+\-*\/%=<>!&|^~?:.]+/y], ["o", /[{}()\[\];,]/y]];

  for (const [cls, t] of tokenizeCpp(src)) f.append(cls ? h("span", { class: cls, text: t }) : document.createTextNode(t)); return f; }

/* ---------- Router ---------- */
const Router = {
  current: "", ignore: false,
  parse() { const parts = (location.hash.replace(/^#\/?/, "") || "").split("/").map(decodeURIComponent); return parts; },
  async onHashChange() {
    if (this.ignore) { this.ignore = false; return; }
    if (Admin.formDirty) {
      const target = location.hash; this.ignore = true; location.hash = this.current;
      const ok = await confirmDlg("Discard unsaved changes?", "The problem form has changes that have not been saved.", "Discard changes", "dan");
      if (!ok) return; Admin.formDirty = false; this.ignore = true; location.hash = target; this.ignore = false;
    }
    this.render();
  },
  render() {
    this.current = location.hash; const [a, b, c] = this.parse(), root = $("#root"); Admin.statusEl = null;
    let page, nav = "home";
    if (a === "admin") { if (!IS_LOCAL) { location.hash = "#/"; return; } nav = "admin"; page = b === "new" ? Admin.form(null) : b === "edit" ? Admin.form(c) : Admin.dashboard(); }
    else if (a === "problem") { page = View.detail(b); nav = "problems"; }
    else if (a === "problems") { page = h("div", { style: "margin-top:32px" }, View.browse()); nav = "problems"; }
    else page = View.home();
    const link = (key, href, label) => h("a", { href, "aria-current": nav === key ? "page" : null, text: label });
    root.replaceChildren(h("header", { class: "top" }, h("div", { class: "wrap bar" }, h("a", { class: "brand", href: "#/" }, "Solve", h("b", { text: "Log" })),
      h("nav", { "aria-label": "Main" }, link("home", "#/", "Home"), link("problems", "#/problems", "Problems"), IS_LOCAL && link("admin", "#/admin", "Admin")),
      h("button", { class: "btn", type: "button", "aria-label": "Toggle light or dark theme", onclick: () => Theme.toggle() }, "Theme"))),
      h("main", { class: "wrap", id: "main" }, page), h("footer", { class: "wrap", text: "SolveLog — a personal problem solving archive." }));
    window.scrollTo(0, 0);
  }
};

/* ---------- Boot ---------- */
(async function main() {
  Theme.init();
  await Store.init();
  window.addEventListener("hashchange", () => Router.onHashChange());
  window.addEventListener("beforeunload", e => { if (IS_LOCAL && (Admin.formDirty || Store.unsafe)) { e.preventDefault(); e.returnValue = ""; } });
  if (IS_LOCAL && !Storage.ok) Toast.show("Browser storage is unavailable. Changes live in memory — export before closing.", true);
  Router.render();
